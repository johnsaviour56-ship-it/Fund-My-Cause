name: Monitoring Infrastructure Setup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/monitoring/**'
      - 'services/monitoring-service/**'
      - '.github/workflows/monitoring-setup.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/monitoring/**'
      - 'services/monitoring-service/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/monitoring

jobs:
  validate:
    name: Validate Monitoring Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate Docker Compose
        working-directory: infrastructure/monitoring
        run: |
          docker-compose config > /dev/null
          echo "✓ Docker Compose configuration is valid"

      - name: Validate Prometheus configuration
        working-directory: infrastructure/monitoring
        run: |
          if [ -f "prometheus.yml" ]; then
            echo "✓ Prometheus configuration exists"
          else
            echo "✗ Prometheus configuration not found"
            exit 1
          fi

      - name: Validate Alert rules
        working-directory: infrastructure/monitoring
        run: |
          if [ -f "prometheus-alerts.yml" ]; then
            echo "✓ Alert rules configuration exists"
          else
            echo "✗ Alert rules configuration not found"
            exit 1
          fi

  build:
    name: Build Monitoring Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: services/monitoring-service/package-lock.json

      - name: Install dependencies
        working-directory: services/monitoring-service
        run: npm ci

      - name: Build
        working-directory: services/monitoring-service
        run: npm run build

      - name: Type check
        working-directory: services/monitoring-service
        run: npm run type-check

      - name: Lint
        working-directory: services/monitoring-service
        run: npm run lint

  test:
    name: Test Monitoring Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: services/monitoring-service/package-lock.json

      - name: Install dependencies
        working-directory: services/monitoring-service
        run: npm ci

      - name: Run tests
        working-directory: services/monitoring-service
        run: npm test

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [validate, build, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: services/monitoring-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy Monitoring Stack
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service monitoring-service \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --services monitoring-service

      - name: Verify deployment
        run: |
          ./scripts/monitoring-setup.sh status

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'infrastructure/monitoring'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  documentation:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: [validate, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate monitoring documentation
        run: |
          mkdir -p docs/monitoring
          cat > docs/monitoring/README.md << 'EOF'
          # Monitoring & Observability

          Comprehensive monitoring infrastructure for Fund My Cause using OpenTelemetry, Prometheus, Grafana, and Jaeger.

          ## Stack Components

          - **Distributed Tracing**: Jaeger
          - **Metrics Collection**: Prometheus
          - **Visualization**: Grafana
          - **Alerting**: AlertManager + PagerDuty
          - **Collection**: OpenTelemetry Collector

          ## Getting Started

          1. Run monitoring setup: `./scripts/monitoring-setup.sh start`
          2. Access Grafana at http://localhost:3000
          3. Configure PagerDuty integration in .env.monitoring
          4. Set up incident response workflows

          See full documentation in infrastructure/monitoring/
          EOF

      - name: Commit documentation
        uses: EndBug/add-and-commit@v9
        with:
          message: 'docs: update monitoring documentation'
          default_author: github_actions
